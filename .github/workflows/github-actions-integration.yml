name: GitHub Actions Integration

on:
  pull_request:
    paths:
      - '.github/**'
      - '**/Dockerfile'
      - 'Makefile'
      - 'Makefile.os'
      - 'Makefile.docker'
    branches:
      - "*"
  push:
    branches:
      - "main"
    paths:
      - '.github/**'
      - '**/Dockerfile'
      - 'Makefile'
      - 'Makefile.os'
      - 'Makefile.docker'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declare default permissions as read only
permissions:
  contents: read
  id-token: write  # Required for OIDC keyless signing
  attestations: write

jobs:
  test-prepare-binaries:
    name: Prepare Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: ./.github/actions/build/prepare-kafka
        with:
          artifactSuffix: "test-container-images"

      - name: Verify binaries artifact was created
        run: |
          if [ ! -f "binaries-test-container-images.tar" ]; then
            echo "❌ Binaries artifact not created"
            exit 1
          fi

          echo "Binaries artifact contents:"
          tar -tf binaries-test-container-images.tar
          echo "✓ Binaries artifact created successfully"

  test-build-containers:
    name: Build Containers
    needs:
      - test-prepare-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Docker
        uses: strimzi/github-actions/.github/actions/dependencies/install-docker@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0

      - uses: strimzi/github-actions/.github/actions/build/build-containers@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          architecture: "amd64"
          artifactSuffix: "test-container-images"
          containerRegistry: "quay.io"
          containerOrg: "strimzi-test-container"
          containerTag: "latest"
          imagesLocation: "./container-archives"

  test-push-containers:
    name: Push Containers
    needs:
      - test-build-containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Checkout is needed for setup-registry.sh
      - name: Checkout github-actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strimzi/github-actions
          ref: bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
          path: github-actions

      - name: Setup local registry
        run: github-actions/.github/tests/setup-registry.sh
        env:
          REGISTRY_IMAGE: "registry:3"
          REGISTRY_USERNAME: "strimzi"
          REGISTRY_PASSWORD: "strimzi"

      - name: Install Docker
        uses: strimzi/github-actions/.github/actions/dependencies/install-docker@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0

      # Needed for SBOM generation in push-containers, which runs on non-PR events (e.g. push to main)
      - name: Install Syft
        uses: strimzi/github-actions/.github/actions/dependencies/install-syft@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          version: "1.57.1"

      - name: Push containers using push-containers action
        uses: strimzi/github-actions/.github/actions/build/push-containers@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          registryUser: "strimzi"
          registryPassword: "strimzi"
          containerRegistry: "registry.strimzi:443"
          architectures: "amd64"
          artifactSuffix: "test-container-images"
